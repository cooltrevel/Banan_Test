<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #fff; --fg: #000; --muted: #777; --card: #f5f5f5; --btn: #e5e5e5; --btn-shadow: #cfcfcf;
      --sheet: #fff; --border: #eee; --accent: #000; --accent-fg: #fff; --disabled: #bbb; --input-border: #ccc;
    }
    :root.dark {
      --bg: #000; --fg: #fff; --muted: #999; --card: #1c1c1c; --btn: #3a3a3a; --btn-shadow: #262626;
      --sheet: #111; --border: #2a2a2a; --accent: #444; --accent-fg: #fff; --disabled: #555; --input-border: #444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .app { height: 100%; display: flex; flex-direction: column; }

    .topbar {
      position: relative; display: flex; justify-content: center; align-items: center;
      padding: 14px 56px;
    }
    .board-btn {
      border: none; background: var(--accent); color: var(--accent-fg); border-radius: 12px;
      padding: 10px 20px; font-size: 22px; font-weight: 700; cursor: pointer;
    }
    .help-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid var(--fg); background: var(--bg); color: var(--fg);
      font-size: 18px; font-weight: 700; cursor: pointer;
    }

    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .energy { width: 220px; margin-bottom: 16px; }
    .energy-bar { height: 10px; background: var(--btn); border-radius: 6px; overflow: hidden; }
    .energy-fill { height: 100%; background: #f5c518; transition: width .3s; }

    #tap {
      width: 220px; height: 220px; border-radius: 50%; border: none; padding: 0;
      background: var(--btn); box-shadow: inset 0 -8px 0 var(--btn-shadow), 0 10px 25px rgba(0,0,0,.15);
      cursor: pointer; transition: transform .08s;
      display: flex; align-items: center; justify-content: center;
    }
    #tap:active { transform: scale(.95); }
    #tap img { width: 170px; height: 170px; pointer-events: none; }
    #tap .emoji { font-size: 110px; pointer-events: none; }

    .shop-btn {
      margin: 16px auto 24px; display: block; border: none; background: var(--accent); color: var(--accent-fg);
      border-radius: 10px; padding: 12px 40px; font-size: 16px; cursor: pointer;
    }

    .plus {
      position: fixed; font-size: 26px; font-weight: 700; color: var(--fg);
      pointer-events: none; animation: up .7s ease-out forwards;
    }
    @keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-80px); } }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    .overlay.bottom { align-items: flex-end; }
    .sheet {
      background: var(--sheet); color: var(--fg); border-radius: 16px; width: 90%; max-width: 340px;
      max-height: 60vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .overlay.bottom .sheet { width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; max-height: 50vh; }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .sheet-head .x { border: none; background: none; color: var(--fg); font-size: 18px; cursor: pointer; }
    .sheet-body { padding: 12px; overflow-y: auto; }

    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      background: var(--btn); color: var(--fg); font-size: 13px; cursor: pointer;
    }
    .tabs button.active { background: var(--accent); color: var(--accent-fg); }

    .item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border-radius: 10px; padding: 10px; margin-bottom: 6px; gap: 8px;
    }
    .item small { color: var(--muted); display: block; }
    .item button, .buy-btn {
      border: none; background: var(--accent); color: var(--accent-fg); border-radius: 8px;
      padding: 7px 10px; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .item button:disabled, .buy-btn:disabled { background: var(--disabled); cursor: default; }
    .buy-btn { width: 100%; padding: 10px; margin-top: 6px; font-size: 14px; }

    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .row.me { font-weight: 700; }
    .note { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0; }
    .buy-input {
      width: 100%; padding: 9px; font-size: 16px; border: 1px solid var(--input-border);
      border-radius: 8px; margin-bottom: 6px; background: var(--card); color: var(--fg);
    }
    .theme-btn {
      width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--accent-fg); font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="board-btn" id="boardBtn">🍌 <span id="score">0</span></button>
    <button class="help-btn" id="helpBtn" aria-label="Информация">?</button>
  </div>

  <div class="main">
    <div class="energy">
      <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
    </div>

    <button id="tap" aria-label="Кликнуть">
      <img id="bananaImg" src="banana.png" alt="банан"
           onerror="this.style.display='none'; document.getElementById('emoji').style.display='block';">
      <span class="emoji" id="emoji" style="display:none">🍌</span>
    </button>
  </div>

  <button class="shop-btn" id="shopBtn">Магазин</button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const BANANAS_PER_STAR = 10000;
  const ENERGY_BOOST_PRICE = 1000000;
  const ENERGY_BOOST_STEP = 10;
  const ENERGY_BOOST_MAX = 10;
  const ENERGY_REGEN_PER_SEC = 0.1;

  const UPGRADES = [
    { id: 'c2', kind: 'click', value: 1, name: 'Двойной банан',   desc: '+1 банан за клик (всего 2)',    price: 25000 },
    { id: 'c8', kind: 'click', value: 8, name: 'Банановый отряд', desc: '+8 бананов за клик (всего 10)', price: 500000 },
    { id: 'a1', kind: 'sec',   value: 1, name: 'Обезьянка',       desc: '+1 банан в секунду',            price: 500000 },
  ];

  const DEFAULT_STATE = {
    bananas: 0, perClick: 1, perSec: 0,
    energy: 100, boosts: 0, bought: {},
    stats: { all: 0, taps: 0 },
    earned: { month: 0, week: 0, monthKey: '', weekKey: '' },
    theme: 'light'
  };
  const saved = JSON.parse(localStorage.getItem('banana_v2') || 'null') || {};
  const state = Object.assign(structuredClone(DEFAULT_STATE), saved);
  if (!Number.isFinite(state.bananas)) state.bananas = 0;
  if (!Number.isFinite(state.energy)) state.energy = 100;
  if (!Number.isFinite(state.boosts)) state.boosts = 0;
  state.bought = state.bought || {};
  state.stats = Object.assign({ all: 0, taps: 0 }, state.stats);
  state.earned = Object.assign({ month: 0, week: 0, monthKey: '', weekKey: '' }, state.earned);

  // Бонусы считаются из купленных улучшений, поэтому старые сохранения не ломаются
  function recalc() {
    let click = 1, sec = 0;
    UPGRADES.forEach(u => {
      if (!state.bought[u.id]) return;
      if (u.kind === 'click') click += u.value; else sec += u.value;
    });
    state.perClick = click;
    state.perSec = sec;
  }
  recalc();

  const save = () => localStorage.setItem('banana_v2', JSON.stringify(state));
  const maxEnergy = () => 100 + state.boosts * ENERGY_BOOST_STEP;
  const fmt = n => Math.floor(n).toLocaleString('ru');

  function applyTheme() {
    document.documentElement.classList.toggle('dark', state.theme === 'dark');
  }
  applyTheme();

  // ---------- Периоды лидерборда ----------
  function periodKeys() {
    const now = new Date();
    const monthKey = now.getFullYear() + '-' + (now.getMonth() + 1);
    const ws = new Date(now); ws.setHours(0, 0, 0, 0);
    ws.setDate(ws.getDate() - ((ws.getDay() + 6) % 7));
    return { monthKey, weekKey: ws.toISOString().slice(0, 10) };
  }

  function addEarned(n) {
    const k = periodKeys();
    if (state.earned.monthKey !== k.monthKey) { state.earned.month = 0; state.earned.monthKey = k.monthKey; }
    if (state.earned.weekKey !== k.weekKey)   { state.earned.week = 0;  state.earned.weekKey = k.weekKey; }
    state.stats.all += n;
    state.earned.month += n;
    state.earned.week += n;
  }

  // ---------- Клик ----------
  document.getElementById('tap').addEventListener('click', (e) => {
    const cost = state.perClick;
    if (state.energy < cost) {
      tg?.HapticFeedback?.notificationOccurred('error');
      return;
    }
    state.energy -= cost;
    state.bananas += cost;
    state.stats.taps++;
    addEarned(cost);

    const p = document.createElement('div');
    p.className = 'plus';
    p.textContent = '+' + cost;
    p.style.left = (e.clientX - 10) + 'px';
    p.style.top = (e.clientY - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
    tg?.HapticFeedback?.impactOccurred('light');
    updateMain();
  });

  // ---------- Тик раз в секунду ----------
  setInterval(() => {
    if (state.perSec > 0) { state.bananas += state.perSec; addEarned(state.perSec); }
    state.energy = Math.min(maxEnergy(), state.energy + ENERGY_REGEN_PER_SEC);
    updateMain();
  }, 1000);

  // ---------- Покупки ----------
  function buyUpgrade(u) {
    if (state.bananas < u.price || state.bought[u.id]) return;
    state.bananas -= u.price;
    state.bought[u.id] = true;
    recalc();
    updateMain();
    renderPanel();
  }

  function buyEnergy() {
    if (state.bananas < ENERGY_BOOST_PRICE || state.boosts >= ENERGY_BOOST_MAX) return;
    state.bananas -= ENERGY_BOOST_PRICE;
    state.boosts++;
    state.energy = Math.min(maxEnergy(), state.energy + ENERGY_BOOST_STEP);
    updateMain();
    renderPanel();
  }

  // ---------- Окна ----------
  let openPanel = null;
  let shopTab = 'upgrades';
  let boardPeriod = 'all';
  let shopRefs = [];

  function showOverlay(kind, title, bottom) {
    closePanel();
    openPanel = kind;
    const ov = document.createElement('div');
    ov.className = 'overlay' + (bottom ? ' bottom' : '');
    ov.id = 'ov';
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-head"><b>${title}</b><button class="x">✕</button></div>
      <div class="sheet-body" id="panelBody"></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) closePanel(); });
    ov.querySelector('.x').onclick = closePanel;
    renderPanel();
  }

  function closePanel() {
    document.getElementById('ov')?.remove();
    openPanel = null;
    shopRefs = [];
  }

  function renderPanel() {
    const body = document.getElementById('panelBody');
    if (!body) return;
    body.innerHTML = '';
    if (openPanel === 'shop') body.appendChild(buildShop());
    if (openPanel === 'board') body.appendChild(buildBoard());
    if (openPanel === 'info') body.appendChild(buildInfo());
  }

  // ---------- Магазин ----------
  function buildShop() {
    shopRefs = [];
    const wrap = document.createElement('div');
    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    [['upgrades', 'Улучшения'], ['bananas', 'Бананы']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (shopTab === id) b.classList.add('active');
      b.onclick = () => { shopTab = id; renderPanel(); };
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    if (shopTab === 'upgrades') {
      UPGRADES.forEach(u => {
        const done = !!state.bought[u.id];
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<div><b>${u.name}</b><small>${done ? 'Куплено' : u.desc}</small></div>`;
        const btn = document.createElement('button');
        btn.textContent = done ? '✓' : fmt(u.price) + ' 🍌';
        btn.onclick = () => buyUpgrade(u);
        row.appendChild(btn);
        shopRefs.push({ el: btn, ok: () => !state.bought[u.id] && state.bananas >= u.price });
        wrap.appendChild(row);
      });

      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<div><b>Банановая энергия +10%</b><small>Куплено ${state.boosts} из ${ENERGY_BOOST_MAX}</small></div>`;
      const eb = document.createElement('button');
      eb.textContent = fmt(ENERGY_BOOST_PRICE) + ' 🍌';
      eb.onclick = buyEnergy;
      row.appendChild(eb);
      shopRefs.push({ el: eb, ok: () => state.boosts < ENERGY_BOOST_MAX && state.bananas >= ENERGY_BOOST_PRICE });
      wrap.appendChild(row);
    }

    if (shopTab === 'bananas') {
      const box = document.createElement('div');
      box.innerHTML = `
        <input id="amount" class="buy-input" type="number" min="10000" step="10000"
               placeholder="Сколько бананов купить?">
        <div id="cost" class="note">Введите количество (кратно 10 000)</div>
        <button id="buyBtn" class="buy-btn" disabled>Купить</button>
        <div class="note">Курс: 10 000 бананов = 1 ⭐. Оплата идёт через бота в Telegram Stars.</div>`;
      const input = box.querySelector('#amount');
      const cost = box.querySelector('#cost');
      const btn = box.querySelector('#buyBtn');
      input.addEventListener('input', () => {
        const v = Math.floor(Number(input.value) || 0);
        if (v >= BANANAS_PER_STAR && v % BANANAS_PER_STAR === 0) {
          cost.textContent = `Цена: ${v / BANANAS_PER_STAR} ⭐`;
          btn.disabled = false;
        } else {
          cost.textContent = 'Введите число, кратное 10 000 (минимум 10 000)';
          btn.disabled = true;
        }
      });
      btn.onclick = () => buyBananas(Math.floor(Number(input.value) || 0));
      wrap.appendChild(box);
    }
    refreshShopButtons();
    return wrap;
  }

  function refreshShopButtons() {
    shopRefs.forEach(r => { r.el.disabled = !r.ok(); });
  }

  // Демо: реальную оплату делает бот через sendInvoice (XTR)
  function buyBananas(v) {
    const stars = v / BANANAS_PER_STAR;
    const text = `Купить ${fmt(v)} бананов за ${stars} ⭐?`;
    const go = () => tg?.showAlert
      ? tg.showAlert('Оплата подключается через бота. Пока это демо.')
      : alert('Демо: оплата подключается через бота.');
    if (tg?.showConfirm) tg.showConfirm(text, ok => { if (ok) go(); });
    else if (confirm(text)) go();
  }

  // ---------- Таблица лидеров (демо: только свои данные) ----------
  function buildBoard() {
    const wrap = document.createElement('div');
    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    [['all', 'За всё время'], ['month', 'За месяц'], ['week', 'За неделю']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (boardPeriod === id) b.classList.add('active');
      b.onclick = () => { boardPeriod = id; renderPanel(); };
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    const name = tg?.initDataUnsafe?.user?.first_name || 'Вы';
    const row = document.createElement('div');
    row.className = 'row me';
    row.innerHTML = `<span>1. ${name}</span><span><b data-board></b> 🍌</span>`;
    wrap.appendChild(row);

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Демо: настоящий топ появится после подключения сервера.';
    wrap.appendChild(note);
    updateBoard();
    return wrap;
  }

  function updateBoard() {
    const el = document.querySelector('[data-board]');
    if (!el) return;
    const value = boardPeriod === 'all' ? state.stats.all
                : boardPeriod === 'month' ? state.earned.month
                : state.earned.week;
    el.textContent = fmt(value);
  }

  // ---------- Информация ----------
  function buildInfo() {
    const wrap = document.createElement('div');
    [
      ['Всего собрано бананов', 'all'],
      ['Всего тапов', 'taps'],
      ['Доход в секунду', 'sec'],
      ['Бананов за клик', 'click'],
      ['Энергия', 'energy'],
    ].forEach(([label, key]) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span>${label}</span><b data-info="${key}"></b>`;
      wrap.appendChild(r);
    });

    const t = document.createElement('button');
    t.className = 'theme-btn';
    t.textContent = state.theme === 'dark' ? 'Сделать тему белой' : 'Сделать тему чёрной';
    t.onclick = toggleTheme;
    wrap.appendChild(t);

    updateInfo();
    return wrap;
  }

  function updateInfo() {
    const vals = {
      all: fmt(state.stats.all),
      taps: fmt(state.stats.taps),
      sec: fmt(state.perSec),
      click: fmt(state.perClick),
      energy: `${Math.floor(state.energy)} / ${maxEnergy()}`,
    };
    document.querySelectorAll('[data-info]').forEach(el => {
      el.textContent = vals[el.dataset.info];
    });
  }

  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    save();
    renderPanel();
  }

  document.getElementById('shopBtn').onclick = () => showOverlay('shop', 'Магазин', true);
  document.getElementById('boardBtn').onclick = () => showOverlay('board', 'Таблица лидеров', false);
  document.getElementById('helpBtn').onclick = () => showOverlay('info', 'Информация', false);

  // ---------- Главный экран ----------
  function updateMain() {
    document.getElementById('score').textContent = fmt(state.bananas);
    const max = maxEnergy();
    document.getElementById('energyFill').style.width = (state.energy / max * 100) + '%';
    refreshShopButtons();
    updateInfo();
    updateBoard();
    save();
  }

  updateMain();
</script>
</body>
</html>
