<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg:#fff; --fg:#000; --muted:#777; --card:#f5f5f5; --btn:#e5e5e5; --btnsh:#cfcfcf;
      --sheet:#fff; --border:#eee; --accent:#000; --accent-fg:#fff; --input:#ccc;
      --disabled:#bbb; --ok:#9be15d; --gold:#ffb300;
    }
    :root.dark {
      --bg:#000; --fg:#fff; --muted:#999; --card:#1c1c1c; --btn:#3a3a3a; --btnsh:#262626;
      --sheet:#111; --border:#2a2a2a; --accent:#444; --accent-fg:#fff; --input:#444;
      --disabled:#555;
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,sans-serif; overflow:hidden;
      user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .app { height:100%; display:flex; flex-direction:column; }
    .topbar { position:relative; display:flex; justify-content:center; align-items:center; padding:14px 56px; }
    .board-btn {
      border:none; background:var(--accent); color:var(--accent-fg); border-radius:12px;
      padding:10px 20px; font-size:22px; font-weight:700; cursor:pointer;
    }
    .help-btn {
      position:absolute; right:14px; top:50%; transform:translateY(-50%);
      width:38px; height:38px; border-radius:50%; border:2px solid var(--fg);
      background:var(--bg); color:var(--fg); font-size:18px; font-weight:700; cursor:pointer;
    }
    .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .collect {
      display:none; margin-bottom:14px; border:none; background:var(--gold); color:#000;
      border-radius:12px; padding:10px 22px; font-size:16px; font-weight:700; cursor:pointer;
      transition:transform .3s, opacity .3s;
    }
    .collect.squash { transform:scale(.85); }
    .collect.collapse { transform:scale(0); opacity:0; }
    .energy { width:220px; margin-bottom:16px; }
    .energy-bar { height:10px; background:var(--btn); border-radius:6px; overflow:hidden; }
    .energy-fill { height:100%; background:#f5c518; transition:width .3s; }
    #tap {
      width:220px; height:220px; border-radius:50%; border:none; padding:0;
      background:var(--btn); box-shadow:inset 0 -8px 0 var(--btnsh), 0 10px 25px rgba(0,0,0,.15);
      cursor:pointer; transition:transform .08s; display:flex; align-items:center; justify-content:center;
    }
    #tap:active { transform:scale(.95); }
    #tap img { width:170px; height:170px; pointer-events:none; }
    #tap .emoji { font-size:110px; pointer-events:none; }
    .shop-btn {
      margin:16px auto 24px; display:block; border:none; background:var(--accent); color:var(--accent-fg);
      border-radius:10px; padding:12px 40px; font-size:16px; cursor:pointer;
    }
    .plus {
      position:fixed; font-size:26px; font-weight:700; color:var(--fg);
      pointer-events:none; animation:up .7s ease-out forwards; z-index:30;
    }
    @keyframes up { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-80px); } }
    .fly { position:fixed; left:0; top:0; font-size:22px; pointer-events:none; z-index:20; }
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10;
      display:flex; align-items:center; justify-content:center;
    }
    .overlay.bottom { align-items:flex-end; }
    .sheet {
      background:var(--sheet); color:var(--fg); border-radius:16px; width:90%; max-width:340px;
      max-height:60vh; display:flex; flex-direction:column; overflow:hidden;
    }
    .overlay.bottom .sheet { width:100%; max-width:100%; border-radius:16px 16px 0 0; max-height:55vh; }
    .sheet-head { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); }
    .sheet-head .x { border:none; background:none; color:var(--fg); font-size:18px; cursor:pointer; }
    .sheet-body { padding:12px; overflow-y:auto; }
    .tabs { display:flex; gap:6px; margin-bottom:10px; }
    .tabs button { flex:1; padding:8px; border:none; border-radius:8px; background:var(--btn); color:var(--fg); font-size:13px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:var(--accent-fg); }
    .item { display:flex; justify-content:space-between; align-items:center; background:var(--card); border-radius:10px; padding:10px; margin-bottom:6px; gap:8px; }
    .item small { color:var(--muted); display:block; }
    .buy { border:none; border-radius:8px; padding:7px 10px; font-size:13px; white-space:nowrap; cursor:pointer; background:var(--disabled); color:#fff; }
    .buy.ok { background:var(--ok); color:#000; }
    .buy.gold { background:var(--gold); color:#000; }
    .buy:disabled { cursor:default; }
    .buy.wide { width:100%; padding:10px; margin-top:6px; font-size:14px; }
    .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .row.me { font-weight:700; }
    .note { font-size:12px; color:var(--muted); text-align:center; padding:8px 0; }
    .buy-input { width:100%; padding:9px; font-size:16px; border:1px solid var(--input); border-radius:8px; margin-bottom:6px; background:var(--card); color:var(--fg); }
    .theme-btn { width:100%; margin-top:12px; padding:10px; border:none; border-radius:8px; background:var(--accent); color:var(--accent-fg); font-size:14px; cursor:pointer; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="board-btn" id="boardBtn">🍌 <span id="score">0</span></button>
    <button class="help-btn" id="helpBtn" aria-label="Информация">?</button>
  </div>

  <div class="main">
    <button class="collect" id="collectBtn">Собрать</button>
    <div class="energy">
      <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
    </div>
    <button id="tap" aria-label="Кликнуть">
      <img id="bananaImg" src="banana.png" alt="банан"
           onerror="this.style.display='none'; document.getElementById('emoji').style.display='block';">
      <span class="emoji" id="emoji" style="display:none">🍌</span>
    </button>
  </div>

  <button class="shop-btn" id="shopBtn">Магазин</button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = id => document.getElementById(id);
  const fmt = n => Math.floor(n).toLocaleString('ru');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const showError = msg => tg?.showAlert ? tg.showAlert(msg) : alert(msg);

  const BANANAS_PER_STAR = 10000;
  const BOOST_PRICE = 1000000, BOOST_MAX = 10;
  const OFF_PRICE = 10000, OFF_MAX = 1440;
  const UPGRADES = [
    { id: 'c2', name: 'Двойной банан',   desc: '+1 банан за клик',       price: 25000 },
    { id: 'c8', name: 'Банановый отряд', desc: '+8 бананов за клик',     price: 500000 },
    { id: 'mk', name: 'Обезьянка',       desc: '+1 банан каждые 10 сек', price: 500000 },
  ];

  // СЕРВЕР: адрес туннеля из cloudflared (без слеша в конце)
  const API = 'https://ваш-адрес.trycloudflare.com';

  async function call(path, method = 'POST') {
    try {
      const r = await fetch(API + path, {
        method,
        keepalive: path === '/api/leave',
        headers: { 'X-Init-Data': tg?.initData || '' },
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, error: j.detail || 'Ошибка сервера' };
      return { ok: true, data: j.data };
    } catch (e) {
      return { ok: false, error: 'Нет связи с сервером' };
    }
  }

  const Server = {
    state:      () => call('/api/state', 'GET'),
    tap:        () => call('/api/tap'),
    buy:        id => call('/api/buy/' + id),
    buyEnergy:  () => call('/api/buy-energy'),
    buyOffline: () => call('/api/buy-offline'),
    collect:    () => call('/api/collect'),
    leave:      () => call('/api/leave'),
    top:        period => call('/api/top?period=' + period, 'GET'),
  };

  let snap = null;
  let collecting = false;
  let openPanel = null;
  let shopTab = 'upgrades';
  let boardPeriod = 'all';
  let shopRefs = [];

  function setTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    localStorage.setItem('banana_theme', dark ? 'dark' : 'light');
  }
  setTheme(localStorage.getItem('banana_theme') === 'dark');

  function updateAll() {
    if (!snap) return;
    $('score').textContent = fmt(snap.bananas);
    $('energyFill').style.width = (snap.energy / snap.maxEnergy * 100) + '%';
    const c = $('collectBtn');
    if (!collecting) {
      c.textContent = 'Собрать +' + fmt(snap.pending);
      c.style.display = snap.pending >= 1 && snap.monkey ? 'block' : 'none';
    }
    refreshShop();
    updateBoard();
    updateInfo();
  }

  $('tap').addEventListener('click', async e => {
    const gain = snap ? snap.perClick : 1;
    const r = await Server.tap();
    if (!r.ok) {
      tg?.HapticFeedback?.notificationOccurred('error');
      if (r.error !== 'Недостаточно энергии') showError(r.error);
      return;
    }
    snap = r.data;
    const p = document.createElement('div');
    p.className = 'plus';
    p.textContent = '+' + gain;
    p.style.left = (e.clientX - 10) + 'px';
    p.style.top = (e.clientY - 20) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
    tg?.HapticFeedback?.impactOccurred('light');
    updateAll();
  });

  function flyBananas(fromEl, toEl, count = 20) {
    const a = fromEl.getBoundingClientRect();
    const b = toEl.getBoundingClientRect();
    const sx = a.left + a.width / 2, sy = a.top + a.height / 2;
    const tx = b.left + b.width / 2, ty = b.top + b.height / 2;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fly';
      el.textContent = '🍌';
      el.style.left = sx + 'px';
      el.style.top = sy + 'px';
      document.body.appendChild(el);
      const ang = Math.random() * Math.PI * 2;
      const r = 50 + Math.random() * 70;
      const ox = Math.cos(ang) * r, oy = Math.sin(ang) * r;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
        { transform: `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px)) scale(1)`, opacity: 1, offset: .35 },
        { transform: `translate(calc(-50% + ${tx - sx}px), calc(-50% + ${ty - sy}px)) scale(.6)`, opacity: 1 },
      ], { duration: 700, delay: i * 25, easing: 'ease-in', fill: 'forwards' }).onfinish = () => el.remove();
    }
    return sleep(700 + (count - 1) * 25);
  }

  $('collectBtn').addEventListener('click', async () => {
    if (collecting) return;
    collecting = true;
    const btn = $('collectBtn');
    btn.classList.add('squash');
    await sleep(120);
    btn.classList.remove('squash');
    btn.classList.add('collapse');
    const flight = flyBananas(btn, $('score'));
    const r = await Server.collect();
    await flight;
    if (r.ok) snap = r.data; else showError(r.error);
    btn.classList.remove('collapse');
    collecting = false;
    updateAll();
  });

  function showOverlay(kind, title, bottom) {
    closePanel();
    openPanel = kind;
    const ov = document.createElement('div');
    ov.className = 'overlay' + (bottom ? ' bottom' : '');
    ov.id = 'ov';
    ov.innerHTML = `<div class="sheet">
      <div class="sheet-head"><b>${title}</b><button class="x">✕</button></div>
      <div class="sheet-body" id="panelBody"></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) closePanel(); });
    ov.querySelector('.x').onclick = closePanel;
    renderPanel();
  }

  function closePanel() {
    document.getElementById('ov')?.remove();
    openPanel = null;
    shopRefs = [];
  }

  function renderPanel() {
    const body = $('panelBody');
    if (!body) return;
    body.innerHTML = '';
    if (openPanel === 'shop') body.appendChild(buildShop());
    if (openPanel === 'board') body.appendChild(buildBoard());
    if (openPanel === 'info') body.appendChild(buildInfo());
    updateAll();
  }

  function buildShop() {
    shopRefs = [];
    const wrap = document.createElement('div');
    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    [['upgrades', 'Улучшения'], ['bananas', 'Бананы']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (shopTab === id) b.classList.add('active');
      b.onclick = () => { shopTab = id; renderPanel(); };
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    if (shopTab === 'upgrades') {
      UPGRADES.forEach(u => {
        const done = !!snap?.bought?.[u.id];
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `<div><b>${u.name}</b><small>${done ? 'Куплено' : u.desc}</small></div>`;
        const btn = document.createElement('button');
        btn.className = 'buy';
        btn.textContent = done ? '✓' : fmt(u.price) + ' 🍌';
        btn.onclick = async () => {
          const r = await Server.buy(u.id);
          if (!r.ok) return showError(r.error);
          snap = r.data;
          renderPanel();
        };
        row.appendChild(btn);
        shopRefs.push({ el: btn, kind: 'green', can: () => !done && snap && snap.bananas >= u.price });
        wrap.appendChild(row);
      });

      const off = document.createElement('div');
      off.className = 'item';
      off.innerHTML = `<div><b>Оффлайн +10 мин</b><small>Лимит: ${snap?.offlineMin ?? 180} мин (макс. ${OFF_MAX})</small></div>`;
      const ob = document.createElement('button');
      ob.className = 'buy';
      ob.textContent = fmt(OFF_PRICE) + ' 🍌';
      ob.onclick = async () => {
        const r = await Server.buyOffline();
        if (!r.ok) return showError(r.error);
        snap = r.data;
        renderPanel();
      };
      off.appendChild(ob);
      shopRefs.push({ el: ob, kind: 'gold', maxed: () => snap && snap.offlineMin >= OFF_MAX });
      wrap.appendChild(off);

      const en = document.createElement('div');
      en.className = 'item';
      en.innerHTML = `<div><b>Банановая энергия +10%</b><small>Куплено ${snap?.boosts ?? 0} из ${BOOST_MAX}</small></div>`;
      const eb = document.createElement('button');
      eb.className = 'buy';
      eb.textContent = fmt(BOOST_PRICE) + ' 🍌';
      eb.onclick = async () => {
        const r = await Server.buyEnergy();
        if (!r.ok) return showError(r.error);
        snap = r.data;
        renderPanel();
      };
      en.appendChild(eb);
      shopRefs.push({ el: eb, kind: 'green', can: () => snap && snap.boosts < BOOST_MAX && snap.bananas >= BOOST_PRICE });
      wrap.appendChild(en);
    }

    if (shopTab === 'bananas') {
      const box = document.createElement('div');
      box.innerHTML = `
        <input id="amount" class="buy-input" type="number" min="10000" step="10000" placeholder="Сколько бананов купить?">
        <div id="cost" class="note">Введите количество (кратно 10 000)</div>
        <button id="buyBtn" class="buy wide" disabled>Купить</button>
        <div class="note">Курс: 10 000 бананов = 1 ⭐. Оплата идёт через бота в Telegram Stars.</div>`;
      const input = box.querySelector('#amount');
      const cost = box.querySelector('#cost');
      const btn = box.querySelector('#buyBtn');
      input.addEventListener('input', () => {
        const v = Math.floor(Number(input.value) || 0);
        if (v >= BANANAS_PER_STAR && v % BANANAS_PER_STAR === 0) {
          cost.textContent = `Цена: ${v / BANANAS_PER_STAR} ⭐`;
          btn.disabled = false;
        } else {
          cost.textContent = 'Введите число, кратное 10 000 (минимум 10 000)';
          btn.disabled = true;
        }
      });
      btn.onclick = () => {
        const v = Math.floor(Number(input.value) || 0);
        const stars = v / BANANAS_PER_STAR;
        const text = `Купить ${fmt(v)} бананов за ${stars} ⭐?`;
        const go = () => showError('Оплата подключается через бота. Пока это демо.');
        if (tg?.showConfirm) tg.showConfirm(text, ok => { if (ok) go(); });
        else if (confirm(text)) go();
      };
      wrap.appendChild(box);
    }
    return wrap;
  }

  function refreshShop() {
    shopRefs.forEach(r => {
      if (r.kind === 'green') {
        const can = !!r.can();
        r.el.disabled = !can;
        r.el.classList.toggle('ok', can);
      } else {
        const maxed = !!r.maxed();
        r.el.disabled = maxed;
        r.el.classList.toggle('gold', !maxed);
        if (maxed) r.el.textContent = 'Максимум';
      }
    });
  }

  function buildBoard() {
    const wrap = document.createElement('div');
    const tabs = document.createElement('div');
    tabs.className = 'tabs';
    [['all', 'За всё время'], ['month', 'За месяц'], ['week', 'За неделю']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (boardPeriod === id) b.classList.add('active');
      b.onclick = () => { boardPeriod = id; renderPanel(); };
      tabs.appendChild(b);
    });
    wrap.appendChild(tabs);

    const name = tg?.initDataUnsafe?.user?.first_name || 'Вы';
    const row = document.createElement('div');
    row.className = 'row me';
    row.innerHTML = `<span>${name}</span><span><b data-board></b> 🍌</span>`;
    wrap.appendChild(row);

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Пока показываются только ваши данные.';
    wrap.appendChild(note);
    return wrap;
  }

  function updateBoard() {
    const el = document.querySelector('[data-board]');
    if (!el || !snap) return;
    const v = boardPeriod === 'all' ? snap.stats.all
            : boardPeriod === 'month' ? snap.stats.month
            : snap.stats.week;
    el.textContent = fmt(v);
  }

  function buildInfo() {
    const wrap = document.createElement('div');
    [
      ['Всего собрано бананов', 'all'],
      ['Всего тапов', 'taps'],
      ['Доход в секунду', 'sec'],
      ['Бананов за клик', 'click'],
      ['Энергия', 'energy'],
      ['Оффлайн-доход', 'offline'],
    ].forEach(([label, key]) => {
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span>${label}</span><b data-info="${key}"></b>`;
      wrap.appendChild(r);
    });

    const t = document.createElement('button');
    t.className = 'theme-btn';
    const dark = document.documentElement.classList.contains('dark');
    t.textContent = dark ? 'Сделать тему белой' : 'Сделать тему чёрной';
    t.onclick = () => { setTheme(!document.documentElement.classList.contains('dark')); renderPanel(); };
    wrap.appendChild(t);
    return wrap;
  }

  function updateInfo() {
    if (!snap) return;
    const vals = {
      all: fmt(snap.stats.all),
      taps: fmt(snap.stats.taps),
      sec: snap.monkey ? '1 банан за 10 сек' : '0',
      click: fmt(snap.perClick),
      energy: `${Math.floor(snap.energy)} / ${snap.maxEnergy}`,
      offline: `${snap.offlineMin} мин (макс. ${snap.offlineMax})`,
    };
    document.querySelectorAll('[data-info]').forEach(el => {
      el.textContent = vals[el.dataset.info];
    });
  }

  $('shopBtn').onclick = () => showOverlay('shop', 'Магазин', true);
  $('boardBtn').onclick = () => showOverlay('board', 'Таблица лидеров', false);
  $('helpBtn').onclick = () => showOverlay('info', 'Информация', false);

  async function refresh() {
    if (collecting) return;
    const r = await Server.state();
    if (r.ok) { snap = r.data; updateAll(); }
  }

  window.addEventListener('pagehide', () => { Server.leave(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') Server.leave();
    else refresh();
  });

  (async () => {
    await refresh();
    setInterval(refresh, 1000);
  })();
</script>
</body>
</html>
